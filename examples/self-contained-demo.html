
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SectionTransition v0.6.0 — Self-contained Demo</title>
  <link rel="stylesheet" href="../dist/section-transition.css">
  <style>
    html,body { margin:0; font-family:system-ui,sans-serif; }
    section { box-sizing:border-box; min-height:100vh; padding:8vw; }
    .a { min-height:200vh; background:#111; color:#fff; }
    .b { min-height:140vh; background:#eee; color:#111; }
    .c { min-height:100vh; background:#222; color:#fff; }
    code { background:rgba(127,127,127,.18); padding:.2em .4em; }
  </style>
</head>
<body>
  <section class="a" data-exit-transition="generated-auto">
    <h1>Section A — Auto</h1>
    <p>Scroll normally through this long section.</p>
    <div style="height:90vh"></div>
    <h2>Near the end</h2>
    <p>One deliberate downward gesture triggers the generated transition.</p>
  </section>

  <section class="b" data-exit-transition="generated-scrub">
    <h1>Section B — Scrub</h1>
    <p>The next exit uses scroll-controlled progress.</p>
  </section>

  <section class="c">
    <h1>Section C</h1>
    <p>Normal scrolling resumed.</p>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="../dist/section-transition.js"></script>
  <script>
    function svgFrame(index, count, label) {
      const p = index / Math.max(1, count - 1);
      const x = Math.round(100 + p * 700);
      const scale = (0.6 + p * 0.8).toFixed(3);
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
          <rect width="1280" height="720" fill="rgb(${20 + Math.round(p*30)},${25 + Math.round(p*20)},${35 + Math.round(p*50)})"/>
          <circle cx="${x}" cy="360" r="${120 * scale}" fill="white" opacity="0.92"/>
          <text x="640" y="100" text-anchor="middle" fill="white" font-family="Arial" font-size="48">${label}</text>
          <text x="640" y="650" text-anchor="middle" fill="white" font-family="Arial" font-size="32">frame ${index + 1}/${count}</text>
        </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const autoCount = 48;
      const scrubCount = 36;

      const autoFrames = Array.from(
        { length: autoCount },
        (_, i) => svgFrame(i, autoCount, "AUTO TRANSITION")
      );

      const scrubFrames = Array.from(
        { length: scrubCount },
        (_, i) => svgFrame(i, scrubCount, "SCRUB TRANSITION")
      );

      window.sectionTransitions = await SectionTransition.init({
        cache: {
          maxFrames: 16,
          useImageBitmap: true
        },

        preload: {
          strategy: "nearby",
          readyFrames: 6,
          deferUntilNear: true
        },

        transitions: {
          "generated-auto": {
            source: {
              type: "sequence",
              src: autoFrames,
              count: autoFrames.length
            },
            scroll: {
              mode: "snap",
              reversible: true
            },
            playback: {
              duration: 1200
            }
          },

          "generated-scrub": {
            source: {
              type: "sequence",
              src: scrubFrames,
              count: scrubFrames.length
            },
            scroll: {
              mode: "scrub",
              distance: "160vh",
              scrub: 0.06
            }
          }
        }
      });

      console.table(sectionTransitions.diagnostics());
    });
  </script>
</body>
</html>
